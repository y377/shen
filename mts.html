<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>临时卡申请工具</title>
    <link rel="stylesheet" href="https://cdn.anssl.cn/bootstrap/css/bootstrap.min.css" integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4=" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.anssl.cn/bootstrap-icons/font/bootstrap-icons.min.css" integrity="sha256-wefUyJrB+p0O/ADxCplCWnk9z+gX2ODyuv3lm8eDGk4=" crossorigin="anonymous" />
    <script src="https://cdn.anssl.cn/bootstrap/js/bootstrap.bundle.min.js" integrity="sha256-5P1JGBOIxI7FBAvT/mb1fCnI5n/NhQKzNUuW7Hq0fMc=" crossorigin="anonymous"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
</head>

<body class="bg-light">
    <div class="container">
        <h5 class="my-4 text-center text-primary-emphasis">【库房临时卡申请】生成工具</h5>
        <div class="row g-3">
            <div class="col-md-3 py-3">
                <label class="form-label">日期</label>
                <input type="text" class="form-control" id="date" disabled>
            </div>
            <div class="col-md-3 py-3">
                <label class="form-label">单号</label>
                <input type="text" class="form-control" id="orderNo" placeholder="请输入工单号（可粘贴URL）">
            </div>
            <div class="col-md-3 py-3">
                <label class="form-label">配件类型</label>
                <select class="form-select" id="partType">
                    <option selected>请选择配件类型</option>
                    <option value="CPU">CPU</option>
                    <option value="AOC线缆">AOC线缆</option>
                    <option value="光模块">光模块</option>
                    <option value="风扇">风扇</option>
                    <option value="硬盘">硬盘</option>
                    <option value="内存">内存</option>
                    <option value="电源">电源</option>
                    <option value="主板">主板</option>
                    <option value="网卡">网卡</option>
                </select>
            </div>
            <div class="col-md-3 py-3">
                <label class="form-label">楼宇</label>
                <select class="form-select" id="building">
                    <option selected>请选择楼宇</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                    <!-- <option value="B3">B3</option> -->
                </select>
            </div>
            <div class="col-md-3 py-3">
                <label class="form-label">项目需求人</label>
                <input type="text" class="form-control" id="demander" placeholder="请输入项目需求人">
            </div>
            <div class="col-md-3 py-3">
                <label class="form-label">申请人</label>
                <input type="text" class="form-control" id="applicant" placeholder="请输入申请人">
            </div>
            <div class="col-md-3 py-3">
                <label class="form-label">备件位置</label>
                <input type="text" class="form-control" id="location" value="122库房">
            </div>
        </div>
        <div class="row justify-content-evenly pt-2">
            <div class="col-md-6 p-3 align-self-end">
                <pre id="recipients" class="bg-secondary-subtle p-3 rounded fs-6"></pre>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-success btn-sm font-monospace" id="copyRecipients" data-clipboard-target="#recipients"><i class="bi bi-envelope-fill px-1 fs-5"></i>复制收件人</button>
                </div>
            </div>
            <div class="col-md-6 align-self-end p-3">
                <pre id="ccList" class="bg-secondary-subtle p-3 rounded fs-6"></pre>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-success btn-sm font-monospace" id="copyCc" data-clipboard-target="#ccList"><i class="bi bi-envelope-at-fill px-1 fs-5"></i>复制抄送</button>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end">
            <button class="btn btn-primary my-3" id="copyBtn" data-clipboard-target="#output"><i class="bi bi-copy fs-5 px-1"></i>复制</button>
        </div>
        <pre id="output" class="bg-secondary-subtle p-3 rounded-4 fs-6"></pre>
    </div>
    <script>
    let rawOrderSource = "";
    const getUTC8DateStr = () => {
        const now = new Date();
        const utc8 = new Date(now.getTime() + 8 * 60 * 60 * 1000);
        const year = utc8.getUTCFullYear();
        const month = String(utc8.getUTCMonth() + 1).padStart(2, '0');
        const day = String(utc8.getUTCDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };
    document.getElementById('date').value = getUTC8DateStr();

    const renderOutput = () => {
        const orderNo = document.getElementById('orderNo').value.trim();
        const partType = document.getElementById('partType').value;
        const building = document.getElementById('building').value;
        const date = document.getElementById('date').value;
        const demander = document.getElementById('demander').value.trim();
        const applicant = document.getElementById('applicant').value.trim();
        const location = document.getElementById('location').value.trim();

        let recipients = [""];
        let ccList = ["idc.am@bytedance.com", "yanyan.1002@bytedance.com", "chenxi.456@bytedance.com", "jsyzmt@asiacom.net.cn"];
        const buildingEmails = { "B1": "yizhengb1zhiban@foreversafe.com.cn", "B2": "yizhengb2zhiban@foreversafe.com.cn" };
        if (buildingEmails[building]) recipients.push(buildingEmails[building]);

        let faultLabel = "自维保故障";
        if (rawOrderSource.includes('/link-recovery-ticket/')) faultLabel = "链路故障";
        else if (partType === 'AOC线缆') faultLabel = "AOC故障";
        const prefixLine = `${date}现场收到${faultLabel}单号：${orderNo}`;

        document.getElementById('recipients').textContent = recipients.join("\n");
        document.getElementById('ccList').textContent = ccList.join("\n");

        const content = `【江苏仪征闽泰机房】-【库房临时卡申请】\n\nHi：all\n${prefixLine}\n出库需求详情：需要出库「${partType}」，现需要使用资产临时卡进入库房出库备件，请确认。\n\n日期：${date}\n项目需求人：${demander}\n申请人：${applicant}\n需求：机房${faultLabel}工单号：${orderNo}\n备件位置：${location}`;

        document.getElementById('output').textContent = content;
    };

    document.getElementById('orderNo').addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
        rawOrderSource = pastedText;
        const match = pastedText.match(/(\d+)(?!.*\d)/);
        if (match) {
            document.getElementById('orderNo').value = match[1];
            renderOutput();
        }
    });
    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', renderOutput));

    new ClipboardJS('#copyBtn');
    new ClipboardJS('#copyRecipients');
    new ClipboardJS('#copyCc');

    renderOutput();
    </script>
</body>

</html>
