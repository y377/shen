<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>临时卡申请工具</title>
    <link crossorigin="anonymous" href="https://lib.baomitu.com/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link crossorigin="anonymous" href="https://lib.baomitu.com/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script crossorigin="anonymous" src="https://lib.baomitu.com/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>
</head>

<body class="p-4 bg-light">
    <div class="container">
        <h5 class="my-4 text-center text-primary-emphasis">【江苏仪征经开机房】-【库房临时卡申请】生成工具</h5>
        <div class="row g-3">
            <div class="col-md-6 py-3">
                <label class="form-label">日期</label>
                <input type="text" class="form-control" id="date" disabled>
            </div>
            <div class="col-md-6 py-3">
                <label class="form-label">单号</label>
                <input type="text" class="form-control" id="orderNo" placeholder="请输入工单号（可粘贴URL）">
            </div>
            <div class="col-md-6 py-3">
                <label class="form-label">配件类型</label>
                <select class="form-select" id="partType">
                    <option selected>请选择配件类型</option>
                    <option value="CPU">CPU</option>
                    <option value="AOC线缆">AOC线缆</option>
                    <option value="光模块">光模块</option>
                    <option value="风扇">风扇</option>
                    <option value="硬盘">硬盘</option>
                    <option value="内存">内存</option>
                    <option value="电源">电源</option>
                    <option value="主板">主板</option>
                    <option value="网卡">网卡</option>
                </select>
            </div>
            <div class="col-md-6 py-3">
                <label class="form-label">项目需求人</label>
                <input type="text" class="form-control" id="demander" placeholder="请输入项目需求人">
            </div>
            <div class="col-md-6 py-3">
                <label class="form-label">申请人</label>
                <input type="text" class="form-control" id="applicant" placeholder="请输入申请人">
            </div>
            <div class="col-md-6 py-3">
                <label class="form-label">备件位置</label>
                <input type="text" class="form-control" id="location" value="122库房">
            </div>
        </div>
        <div class="d-flex justify-content-end">
            <button class="btn btn-primary my-3" id="copyBtn" data-clipboard-target="#output"><i class="bi bi-clipboard px-1"></i>复制</button> 
        </div>

        <pre id="output" class="bg-secondary-subtle p-3 rounded-4 fs-5"></pre>
    </div>

    <script>
        let rawOrderSource = ""; // 保存粘贴原始URL

        const getUTC8DateStr = () => {
            const now = new Date();
            const utc8 = new Date(now.getTime() + 8 * 60 * 60 * 1000);
            const year = utc8.getUTCFullYear();
            const month = String(utc8.getUTCMonth() + 1).padStart(2, '0');
            const day = String(utc8.getUTCDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        document.getElementById('date').value = getUTC8DateStr();

        const renderOutput = () => {
            const orderNo = document.getElementById('orderNo').value.trim();
            const partType = document.getElementById('partType').value;
            const date = document.getElementById('date').value;
            const demander = document.getElementById('demander').value.trim();
            const applicant = document.getElementById('applicant').value.trim();
            const location = document.getElementById('location').value.trim();

            // 判断故障类型标签
            let faultLabel = "自维保故障";
            if (rawOrderSource.includes('/link-recovery-ticket/')) {
                faultLabel = "链路故障";
            } else if (partType === 'AOC线缆') {
                faultLabel = "AOC故障";
            }

            const prefixLine = `${date}现场收到${faultLabel}单号：${orderNo}`;

            const content =
                `【江苏仪征经开机房】-【库房临时卡申请】

Hi：all
${prefixLine}
出库需求详情：需要出库「${partType}」，现需要使用资产临时卡进入库房出库备件，请确认。

日期：${date}
项目需求人：${demander}
申请人：${applicant}
需求：机房${faultLabel}工单号：${orderNo}
备件位置：${location}`;

            document.getElementById('output').textContent = content;
        };

        // 粘贴提取 URL 数字并保存源地址
        document.getElementById('orderNo').addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            rawOrderSource = pastedText;
            const match = pastedText.match(/(\d+)(?!.*\d)/);
            if (match) {
                document.getElementById('orderNo').value = match[1];
                renderOutput();
            }
        });

        // 所有输入变动时重新渲染
        document.querySelectorAll('input, select').forEach(el =>
            el.addEventListener('input', renderOutput)
        );

        new ClipboardJS('#copyBtn');

        renderOutput();
    </script>
</body>

</html>
